<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Generator Dokumentasi Foto A4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .a4-page {
            width: 210mm;
            height: 297mm;
            padding: 10mm 12mm;
            margin: 10mm auto;
            background: white;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        @media print {
            body { background: none; }
            .no-print { display: none !important; }
            .a4-page {
                margin: 0;
                box-shadow: none;
                width: 100%;
                height: 297mm;
                page-break-after: always;
            }
        }
    </style>
</head>
<body class="p-4 sm:p-8 text-slate-800">

    <div class="max-w-4xl mx-auto mb-8 bg-white p-6 rounded-2xl shadow-md no-print flex flex-col gap-5 border border-slate-200">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b pb-4">
            <div>
                <h1 class="text-xl font-bold text-slate-900">Generator Halaman Dokumentasi A4</h1>
                <p class="text-xs text-slate-500 mt-0.5">Kertas A4 Portrait, foto otomatis di-crop memenuhi kotak secara penuh.</p>
            </div>
            <div class="flex flex-wrap gap-2 w-full sm:w-auto">
                <button onclick="downloadPDF()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-2.5 rounded-xl transition cursor-pointer">📥 Download PDF</button>
                <button onclick="shareDirectPDF()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-2.5 rounded-xl transition cursor-pointer flex items-center gap-1.5 shadow-sm">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.124-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                    Kirim Langsung ke WA
                </button>
                <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold px-3 py-2.5 rounded-xl transition cursor-pointer">🖨️ Cetak</button>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Judul / Nama Kegiatan</label>
                <input type="text" id="inputJudul" value="LAPORAN DOKUMENTASI KEGIATAN LAPANGAN" oninput="renderPages()" class="w-full text-xs bg-slate-50 border border-slate-300 rounded-xl p-2.5 outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Keterangan / Lokasi / Tanggal</label>
                <input type="text" id="inputSub" value="Kabupaten Lembata — Tahun 2026" oninput="renderPages()" class="w-full text-xs bg-slate-50 border border-slate-300 rounded-xl p-2.5 outline-none focus:border-blue-500">
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Upload Foto Dokumentasi (Bisa pilih banyak sekaligus)</label>
            <input type="file" id="uploadFoto" accept="image/*" multiple onchange="handleFiles(this)" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-slate-200 rounded-xl p-1 bg-slate-50">
        </div>
    </div>

    <div id="printArea" class="mx-auto flex flex-col gap-6"></div>

    <script>
        let uploadedPhotos = [];
        const printDateStr = 'Tanggal Cetak: ' + new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });

        function handleFiles(input) {
            const files = Array.from(input.files);
            if (files.length === 0) return;

            uploadedPhotos = [];
            let loadedCount = 0;
            
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedPhotos.push({
                        src: e.target.result,
                        name: file.name,
                        caption: file.name.substring(0, file.name.lastIndexOf('.')) || 'Dokumentasi kegiatan'
                    });
                    loadedCount++;
                    if (loadedCount === files.length) {
                        renderPages();
                    }
                }
                reader.readAsDataURL(file);
            });
        }

        function renderPages() {
            const printArea = document.getElementById('printArea');
            printArea.innerHTML = '';

            const currentJudul = document.getElementById('inputJudul').value || 'DOKUMENTASI KEGIATAN';
            const currentSub = document.getElementById('inputSub').value || '';

            if (uploadedPhotos.length === 0) {
                printArea.innerHTML = `
                    <div class="a4-page">
                        <div>
                            <div class="border-b-2 border-slate-800 pb-2 mb-2 flex justify-between items-end">
                                <div>
                                    <h2 class="text-xs sm:text-sm font-bold text-slate-900 uppercase tracking-wide">${currentJudul}</h2>
                                    <p class="text-[9px] text-slate-600 mt-0.5">${currentSub}</p>
                                </div>
                                <div class="text-right text-[9px] text-slate-500">
                                    <span>Halaman 1 dari 1</span>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-x-6 gap-y-2">
                                <div class="border border-dashed border-slate-300 rounded-xl p-6 text-center text-slate-400 text-xs flex flex-col items-center justify-center h-[200px] col-span-2">
                                    <span>Belum ada foto yang di-upload. Silakan pilih foto melalui panel di atas.</span>
                                </div>
                            </div>
                        </div>
                        <div class="border-t border-slate-200 pt-1.5 flex justify-between items-center text-[9px] text-slate-500">
                            <span>Dokumen Resmi Dicetak Otomatis</span>
                            <span>${printDateStr}</span>
                        </div>
                    </div>`;
                return;
            }

            const photosPerPage = 6; 
            const totalPages = Math.ceil(uploadedPhotos.length / photosPerPage);

            for (let p = 0; p < totalPages; p++) {
                const pagePhotos = uploadedPhotos.slice(p * photosPerPage, (p + 1) * photosPerPage);
                
                let photoHtml = '';
                pagePhotos.forEach((photo, idx) => {
                    const globalIdx = (p * photosPerPage) + idx;
                    photoHtml += `
                        <div class="flex flex-col bg-white border border-slate-200 rounded-xl overflow-hidden p-1.5">
                            <div class="w-full h-[260px] bg-slate-900 rounded-lg relative" style="background-image: url('${photo.src}'); background-size: cover; background-position: center; background-repeat: no-repeat;">
                                <span class="absolute top-1.5 left-1.5 bg-slate-900/80 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-md">Foto ${globalIdx + 1}</span>
                            </div>
                            <div class="mt-1 px-0.5">
                                <input type="text" value="${photo.caption}" oninput="uploadedPhotos[${globalIdx}].caption = this.value" class="w-full text-[10px] bg-slate-50 border border-slate-200 rounded-lg p-1 outline-none focus:border-blue-500 text-slate-700 font-medium" placeholder="Tulis keterangan foto...">
                            </div>
                        </div>
                    `;
                });

                const remainingSlots = photosPerPage - pagePhotos.length;
                for(let i=0; i<remainingSlots; i++) {
                    photoHtml += `
                        <div class="flex flex-col bg-white border border-dashed border-slate-200 rounded-xl overflow-hidden p-1.5 opacity-30">
                            <div class="w-full h-[260px] bg-slate-50 rounded-lg flex items-center justify-center text-[10px] text-slate-400">
                                Kosong
                            </div>
                            <div class="mt-1 px-0.5">
                                <div class="w-full h-[22px] bg-slate-50 rounded-lg"></div>
                            </div>
                        </div>
                    `;
                }

                const pageDiv = document.createElement('div');
                pageDiv.className = 'a4-page';
                pageDiv.innerHTML = `
                    <div>
                        <div class="border-b-2 border-slate-800 pb-2 mb-2 flex justify-between items-end">
                            <div>
                                <h2 class="text-xs sm:text-sm font-bold text-slate-900 uppercase tracking-wide">${currentJudul}</h2>
                                <p class="text-[9px] text-slate-600 mt-0.5">${currentSub}</p>
                            </div>
                            <div class="text-right text-[9px] text-slate-500">
                                <span>Halaman ${p + 1} dari ${totalPages}</span>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-x-6 gap-y-2">
                            ${photoHtml}
                        </div>
                    </div>
                    <div class="border-t border-slate-200 pt-1.5 flex justify-between items-center text-[9px] text-slate-500">
                        <span>Dokumentasi Kegiatan Lapangan</span>
                        <span>${printDateStr}</span>
                    </div>
                `;
                printArea.appendChild(pageDiv);
            }
        }

        // Pengaturan PDF yang aman untuk HP (Scale diturunkan agar tidak Out of Memory)
        function getPdfConfig() {
            const element = document.getElementById('printArea');
            const opt = {
                margin:       0,
                filename:     'Dokumentasi_Kegiatan.pdf',
                image:        { type: 'jpeg', quality: 0.90 },
                html2canvas:  { 
                    scale: 1.5,          // Diturunkan dari 2 ke 1.5 agar aman untuk RAM HP
                    useCORS: true, 
                    allowTaint: true,
                    logging: false 
                },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            return { element, opt };
        }

        function downloadPDF() {
            const { element, opt } = getPdfConfig();
            html2pdf().from(element).set(opt).save().catch(err => {
                console.error("Gagal mendownload PDF:", err);
                alert("Memori perangkat penuh atau foto terlalu besar. Coba kurangi jumlah foto dalam sekali upload.");
            });
        }

        async function shareDirectPDF() {
            const judul = document.getElementById('inputJudul').value || 'DOKUMENTASI KEGIATAN';
            const sub = document.getElementById('inputSub').value || '';
            const { element, opt } = getPdfConfig();

            try {
                const btn = event.currentTarget;
                const originalText = btn.innerHTML;
                btn.innerHTML = '⏳ Menyiapkan...';
                btn.disabled = true;

                const pdfBlob = await html2pdf().from(element).set(opt).output('blob');
                const pdfFile = new File([pdfBlob], 'Dokumentasi_Kegiatan.pdf', { type: 'application/pdf' });

                btn.innerHTML = originalText;
                btn.disabled = false;

                if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
                    await navigator.share({
                        title: judul,
                        text: `${judul}\n${sub}`,
                        files: [pdfFile]
                    });
                } else {
                    downloadPDF();
                }
            } catch (error) {
                const btn = event.currentTarget;
                if(btn) {
                    btn.innerHTML = 'Kirim Langsung ke WA';
                    btn.disabled = false;
                }
                console.log('Share dibatalkan atau galat:', error);
            }
        }
    </script>
</body>
</html>
